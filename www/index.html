const PINTRO={lao:"退休後每月能領多少，來自兩個制度：勞保老年年金（社會保險）與勞退新制（個人帳戶）。這裡把兩者合計，試算到退休年齡時的月退休金。",gap:"綜合勞保勞退月領、個人投資累積與退休所需資產，看你的退休規劃還差多少；不足時會算出每月要多投入多少來補缺口。",coast:"Coast FIRE 是指資產累積到某個門檻後，即使不再投入新資金，靠現有資產的複利成長，也能在預計退休年齡達到退休目標。這裡算你目前離這個門檻還有多遠。",mc:"一般試算假設每年固定報酬，但市場會波動。蒙地卡羅用隨機抽樣跑 1,000 次不同的市場情境，給你成功率與資產分布，而不是單一數字。"};
const PABOUT={lao:"<b>勞保月退公式</b>：A 式 ＝ 平均月投保薪資 × 年資 × 0.775% ＋ 3,000；B 式 ＝ 平均月投保薪資 × 年資 × 1.55%，實際領取兩式中較高者，且需年資滿 15 年才能領月退。<br><b>勞退新制</b>：雇主強制提繳 6%，勞工可自願提繳 0–6%。退休時年資滿 15 年可選月領（以 20 年年金化試算），否則一次領。<br>薪資成長與帳戶報酬都以月複利計算。",gap:"本頁的「帶入」按鈕會從你的記帳資料帶入近一年支出、儲蓄與投資帳戶資產與定期定額合計；也可以先到「勞保勞退」分頁算出月領，再帶回來。",coast:"Coast FIRE 門檻比一般 FIRE 低，但並不是今天就能退休：它代表「今天起不用再投入，退休時也能達標」。達到之後，你仍需要工作收入支應日常生活，只是不必再額外為退休存錢。",mc:"蒙地卡羅假設每年報酬服從常態分布且彼此獨立，提領在每月月底進行。真實市場有肥尾風險與報酬順序風險，結果只是機率分布的參考。「帶入」會使用「退休缺口」分頁的預估退休資產與退休時年提領。"};
