 return best&&(mx>=date||(D.pxDate&&D.pxDate>=date))?{p:H[best],d:best}:null}

 if(h.mk=="man"){if(h.p>0)buyAt(h,amtH,h.p);else h.pend=(h.pend||0)+amtH;return}

async function updPrices(force){
 const hs=D.accs.flatMap(a=>(a.hold||[]).filter(h=>h.mk!="man"));const pendN=hs.filter(h=>h.pl&&h.pl.length).length;if(!hs.length)return"none";if(!force&&D.pxDate==today()&&!pendN)return"skip";
 const map={};let src=[];
 for(const u of ["prices.json",D.pxUrl].filter(Boolean)){try{const r=await fetch(u+(u.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});if(r.ok){const j=await r.json();Object.assign(map,j.prices||{});if(Object.keys(j.prices||{}).length)src.push("prices.json "+(j.updated||""))}}catch(e){}}
 const miss=m=>hs.some(h=>h.mk==m&&!map[h.sym]),num=v=>parseFloat(String(v==null?"":v).replace(/,/g,""));
 if(miss("tw")){try{const j=await(await fetch("https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL")).json();j.forEach(x=>{const p=num(x.ClosingPrice),c=num(x.Change);if(p&&!map[x.Code])map[x.Code]={p,pv:isNaN(c)?undefined:p-c,d:today()}});src.push("證交所")}catch(e){}}
 if(miss("tw")){try{const j=await(await fetch("https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes")).json();j.forEach(x=>{const c=x.SecuritiesCompanyCode||x.Code,p=num(x.Close||x.ClosingPrice),g=num(x.Change);if(c&&p&&!map[c])map[c]={p,pv:isNaN(g)?undefined:p-g,d:today()}});src.push("櫃買中心")}catch(e){}}
 for(const h of hs.filter(x=>(x.mk=="us"||x.mk=="sg")&&!map[x.sym])){try{const ys=h.mk=="sg"&&!h.sym.includes(".")?h.sym+".SI":h.sym,j=await(await fetch("https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(ys)+"?range=5d&interval=1d")).json(),m=j.chart.result[0].meta,p=num(m.regularMarketPrice);if(p){map[h.sym]={p,pv:num(m.chartPreviousClose),d:today()};if(!src.includes("Yahoo"))src.push("Yahoo")}}catch(e){}}
 const yh=async h=>{const ys=h.mk=="sg"&&!h.sym.includes(".")?h.sym+".SI":h.mk=="tw"?h.sym+".TW":h.sym;for(const sfx of(h.mk=="tw"?[".TW",".TWO"]:[""])){try{const y=h.mk=="tw"?h.sym+sfx:ys,j=await(await fetch("https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(y)+"?range=6mo&interval=1d")).json(),r=j.chart.result[0],off=(r.meta&&r.meta.gmtoffset)||0,cl=r.indicators.quote[0].close;let n=0;r.timestamp.forEach((t,i)=>{if(cl[i]>0){addHist(h,new Date((t+off)*1e3).toISOString().slice(0,10),cl[i]);n++}});if(n)return true}catch(e){}}return false};
 hs.forEach(h=>{const q=map[h.sym];if(q&&q.h)Object.keys(q.h).forEach(d=>addHist(h,d,q.h[d]))});
 for(const h of hs.filter(x=>x.pl&&x.pl.length&&!histPx(x,x.pl[0].d)))await yh(h);
 let ok=0;hs.forEach(h=>{const q=map[h.sym];if(q&&q.p>0){h.pv=q.pv!=null?q.pv:(h.p&&h.p!==q.p?h.p:h.pv);h.p=q.p;h.pd=q.d||today();addHist(h,h.pd,h.p);if(q.perf)h.perf=q.perf;if(q.div)h.dv=q.div;ok++;if(h.pend>0){h.sh=Math.round((h.sh+h.pend/h.p)*1e6)/1e6;h.cost=Math.round((h.cost+h.pend)*100)/100;h.pend=0}}});

 if(ok||rs)save();return ok||rs?"ok":"fail"}
