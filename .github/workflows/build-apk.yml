name: build-apk

on:
  workflow_dispatch:        # 到 Actions 頁面按 Run workflow 就會打包
  push:
    tags: ["v*"]            # 推送 v1.0.0 這類標籤時，也會建立 Release 並附上 APK

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安裝套件
        run: npm install

      - name: 建立 Android 專案
        run: npx cap add android

      - name: 產生 App 圖示
        run: npx capacitor-assets generate --android

      - name: 同步網頁內容
        run: npx cap sync android

      - name: 設定固定簽章與版本號（才能直接覆蓋安裝更新）
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  moneyapp {
                      storeFile file("../../signing/money-app.keystore")
                      storePassword "moneyapp123"
                      keyAlias "moneyapp"
                      keyPassword "moneyapp123"
                      storeType "pkcs12"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.moneyapp }
                  release { signingConfig signingConfigs.moneyapp }
              }
          }
          EOF

      - name: 打包 APK（debug 簽章，可直接安裝）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上傳 APK
        uses: actions/upload-artifact@v4
        with:
          name: money-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 建立 Release（只在推送標籤時）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
