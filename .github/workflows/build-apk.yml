name: build-apk

on:
  workflow_dispatch:        # 到 Actions 頁面按 Run workflow 就會打包
  push:
    branches: [main]        # App 內容有更新就自動打包並發布
    paths:
      - "www/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:                # 連續推送時，只保留最新那次打包
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm              # 套件快取，不用每次重新下載

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 快取（Android 打包用的套件）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 安裝套件（依 package-lock.json 固定版本）
        run: npm ci

      - name: 建立 Android 專案
        run: npx cap add android

      - name: 產生 App 圖示
        run: npx capacitor-assets generate --android

      - name: 寫入 App 版本號（跟 Release 一致；換版時 App 會自動保留一份更新前的資料備份）
        run: sed -i 's/const APP_VER="[^"]*"/const APP_VER="1.0.${{ github.run_number }}"/' www/index.html && grep -o 'const APP_VER="[^"]*"' www/index.html

      - name: 同步網頁內容
        run: npx cap sync android

      - name: 設定固定簽章與版本號（才能直接覆蓋安裝更新）
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  moneyapp {
                      storeFile file("../../signing/money-app.keystore")
                      storePassword "moneyapp123"
                      keyAlias "moneyapp"
                      keyPassword "moneyapp123"
                      storeType "pkcs12"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.moneyapp }
                  release { signingConfig signingConfigs.moneyapp }
              }
          }
          EOF

      - name: 打包 APK（debug 簽章，可直接安裝）
        working-directory: android
        run: |
          chmod +x gradlew
          # Maven 偶爾回 429（請求太多），失敗時等一下再試，最多 3 次
          for i in 1 2 3; do ./gradlew assembleDebug && exit 0; echo "第 $i 次失敗，60 秒後重試"; sleep 60; done; exit 1

      - name: 整理檔名
        run: cp android/app/build/outputs/apk/debug/app-debug.apk money-app.apk

      - name: 上傳 APK（Actions 頁面也能下載）
        uses: actions/upload-artifact@v4
        with:
          name: money-app-apk
          path: money-app.apk

      - name: 發布到 Releases（固定下載連結永遠指向最新版）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 記帳本 1.0.${{ github.run_number }}
          body: |
            自動打包：${{ github.event.head_commit.message || '手動執行' }}
            下載最新版固定連結：https://github.com/${{ github.repository }}/releases/latest/download/money-app.apk
          files: money-app.apk
          make_latest: true
