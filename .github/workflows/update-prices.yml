name: update-prices

on:
  schedule:
    - cron: "30 8 * * 1-5"   # UTC 08:30 = 台灣時間 16:30（台股收盤後），週一到週五
  workflow_dispatch:         # 也可以到 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取股價
        run: python scripts/update_prices.py
      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "update prices" && git push)
